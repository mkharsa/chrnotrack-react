<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#111827"/>

  <!-- Crown / top of stopwatch -->
  <rect x="78" y="18" width="24" height="12" rx="6" fill="#F9FAFB"/>

  <!-- Left button -->
  <rect x="52" y="30" width="30" height="10" rx="5" transform="rotate(-30 52 30)" fill="#F9FAFB"/>
  <!-- Right button -->
  <rect x="98" y="30" width="30" height="10" rx="5" transform="rotate(30 98 30)" fill="#F9FAFB"/>

  <!-- Watch body -->
  <circle cx="90" cy="112" r="58" fill="#1F2937"/>
  <circle cx="90" cy="112" r="58" stroke="#F9FAFB" stroke-width="6"/>

  <!-- Inner ring -->
  <circle cx="90" cy="112" r="46" stroke="#374151" stroke-width="2"/>

  <!-- Tick marks -->
  <line x1="90" y1="70" x2="90" y2="78" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="146" x2="90" y2="154" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="136" y1="112" x2="144" y2="112" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="112" x2="44" y2="112" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>

  <!-- Minute hand (pointing to 12) -->
  <line x1="90" y1="112" x2="90" y2="78" stroke="#F9FAFB" stroke-width="4" stroke-linecap="round"/>
  <!-- Second hand (pointing to ~2 o'clock) -->
  <line x1="90" y1="112" x2="116" y2="86" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="90" cy="112" r="5" fill="#F9FAFB"/>
</svg>
