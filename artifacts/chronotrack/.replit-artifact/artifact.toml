kind = "web"
previewPath = "/"
title = "Connected ChronoTrack"
version = "1.0.0"
id = "artifacts/chronotrack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20457

[services.development]
run = "pnpm --filter @workspace/chronotrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chronotrack", "run", "build" ]
publicDir = "artifacts/chronotrack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20457"
BASE_PATH = "/"
