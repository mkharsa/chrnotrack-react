name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/chronotrack exec vite build --config vite.github.config.ts

      - name: Add iOS platform
        run: cd artifacts/chronotrack && npx cap add ios

      - name: Capacitor sync iOS
        run: cd artifacts/chronotrack && npx cap sync ios

      - name: Install CocoaPods dependencies
        run: cd artifacts/chronotrack/ios/App && pod install

      - name: Build iOS archive (unsigned)
        run: |
          cd artifacts/chronotrack/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/ChronoTrack.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            | xcpretty || true

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ChronoTrack-ios-archive
          path: ${{ runner.temp }}/ChronoTrack.xcarchive
          retention-days: 30
