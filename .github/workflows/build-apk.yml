name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          # Fail loudly if the secret is missing
          if [ -z "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set! Google Sign-In will fail."
            exit 1
          fi
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo "=== Keystore info (alias & SHA-1) ==="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep -E "Alias name|SHA1:"
          KEYSTORE_SHA1=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep "SHA1:" | head -1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Keystore SHA1 (normalized): $KEYSTORE_SHA1"
          echo "Expected SHA1:              852942715bc1fc491d75000c6a9af7b05c695ac4"
          if [ "$KEYSTORE_SHA1" != "852942715bc1fc491d75000c6a9af7b05c695ac4" ]; then
            echo "::error::Keystore SHA-1 mismatch! Got $KEYSTORE_SHA1"
            exit 1
          fi
          echo "✅ Keystore SHA-1 matches — Google Sign-In will work."

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/chronotrack exec vite build --config vite.capacitor.config.ts

      - name: Capacitor sync
        run: cd artifacts/chronotrack && npx cap sync android

      - name: Make gradlew executable
        run: chmod +x artifacts/chronotrack/android/gradlew

      - name: Build debug APK
        run: cd artifacts/chronotrack/android && ./gradlew assembleDebug --no-daemon

      - name: Verify APK SHA-1
        run: |
          APK="artifacts/chronotrack/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "=== APK certificate SHA-1 ==="
          keytool -printcert -jarfile "$APK" | grep -E "SHA1:|SHA-1:" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronoTrack-debug
          path: artifacts/chronotrack/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: artifacts/chronotrack/android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Message: ${{ github.event.head_commit.message }}
