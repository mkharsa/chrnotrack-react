name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/chronotrack exec vite build --config vite.capacitor.config.ts

      - name: Capacitor sync
        run: cd artifacts/chronotrack && npx cap sync android

      - name: Make gradlew executable
        run: chmod +x artifacts/chronotrack/android/gradlew

      - name: Build debug APK
        run: cd artifacts/chronotrack/android && ./gradlew assembleDebug --no-daemon

      - name: Print debug keystore SHA-1
        run: |
          KEYSTORE=$(find ~ -name "debug.keystore" 2>/dev/null | head -1)
          echo "Keystore found at: $KEYSTORE"
          if [ -n "$KEYSTORE" ]; then
            keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android 2>/dev/null | tee /tmp/keytool_out.txt
            SHA1=$(grep "SHA1:" /tmp/keytool_out.txt | head -1 | tr -d ' ' | cut -d':' -f2-)
          else
            echo "No keystore found, generating one..."
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
            SHA1=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep "SHA1:" | head -1 | tr -d ' ' | cut -d':' -f2-)
          fi
          echo "### 🔑 Debug Keystore SHA-1" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SHA1" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "SHA-1: $SHA1"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronoTrack-debug
          path: artifacts/chronotrack/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: artifacts/chronotrack/android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Message: ${{ github.event.head_commit.message }}
